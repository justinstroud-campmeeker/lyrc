[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lyrc"
version = "0.1.0"
description = "Terminal-based song lyrics editor for Suno and similar tools"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.50.0",
    "pyphen>=0.14.0",
    "pyperclip>=1.8.0",
    "requests>=2.31.0",
]

[project.scripts]
lyrc = "main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["lyrc"]
